[project]
name = "quant-fund-database"
version = "0.1.0"
description = "量化私募基金周度业绩数据库与自包含 HTML 看板"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Generated-dashboard templates and bootstrap scripts intentionally contain long lines
# and imports after a project-root path adjustment.
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
